name: Build v2rayN 5.39 for XP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Build_v2rayN_5_39_for_XP:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install .NET Framework 4.0 reference assemblies
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -OutputDirectory packages
          if ($LASTEXITCODE -ne 0) { throw "Failed to install .NET Framework 4.0 reference assemblies" }

      - name: Restore main application NuGet packages
        shell: pwsh
        run: |
          msbuild ".\v2rayN\v2rayN\v2rayN.csproj" /t:Restore /p:RestoreIgnoreFailedSources=true
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed" }

      - name: Build main application (.NET Framework 4.0 x86)
        shell: pwsh
        run: |
          msbuild ".\v2rayN\v2rayN\v2rayN.csproj" /m /p:Configuration=Release /p:Platform=x86 /v:minimal
          if ($LASTEXITCODE -ne 0) { throw ".NET Framework 4.0 x86 build failed" }

      - name: Prepare build files
        shell: pwsh
        run: |
          $main = ".\v2rayN\v2rayN\bin\Release\net40"
          $out = Join-Path $env:GITHUB_WORKSPACE "publish"

          if (!(Test-Path $main)) { throw "Main application output not found: $main" }

          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item (Join-Path $main "*") $out -Recurse -Force

          if (!(Get-ChildItem $out -File -Recurse | Select-Object -First 1)) {
            throw "No build files were copied to the publish directory."
          }
          Write-Host "Prepared main application files in: $out"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayN-5.39-XP-net40-x86
          path: publish/**
          if-no-files-found: error
          retention-days: 14
